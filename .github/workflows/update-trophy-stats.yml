name: Update Trophy Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trophy update and publish
        env:
          PUBLISH_TO_JSONBIN: "true"
          FANTRAX_LEAGUE_ID: ${{ secrets.FANTRAX_LEAGUE_ID }}
          GHLTROPHYTRACKER_BIN_ID: ${{ secrets.GHLTROPHYTRACKER_BIN_ID }}
          JSONBINIO_X_MASTER_KEY: ${{ secrets.JSONBINIO_X_MASTER_KEY }}
          JSONBINIO_X_ACCESS_KEY: ${{ secrets.JSONBINIO_X_ACCESS_KEY }}
          __cf_bm: ${{ secrets.CF_BM }}
          cf_clearance: ${{ secrets.CF_CLEARANCE }}
          FX_RM: ${{ secrets.FX_RM }}
          JSESSIONID: ${{ secrets.JSESSIONID }}
        run: python MainUpdateTrophyStats.py
