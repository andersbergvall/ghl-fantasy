name: Update Trophy Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "49 7 * * *"
      timezone: "Europe/Stockholm"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trophy and matchup update
        env:
          TROPHY_TRACKER_SYNC_GIT: "true"
          FANTRAX_LEAGUE_ID: ${{ secrets.FANTRAX_LEAGUE_ID }}
          WEEKS_IN_SEASON: ${{ vars.WEEKS_IN_SEASON || 22 }}
          __cf_bm: ${{ secrets.CF_BM }}
          cf_clearance: ${{ secrets.CF_CLEARANCE }}
          FX_RM: ${{ secrets.FX_RM }}
          JSESSIONID: ${{ secrets.JSESSIONID }}
        run: python MainUpdateTrophyStats.py
