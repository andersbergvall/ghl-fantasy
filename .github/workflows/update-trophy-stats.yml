name: Update Trophy Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "49 7 * * *"
      timezone: "Europe/Stockholm"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trophy and matchup update
        env:
          PUBLISH_TO_CLOUDFLARE_KV: "true"
          FANTRAX_LEAGUE_ID: ${{ secrets.FANTRAX_LEAGUE_ID }}
          WEEKS_IN_SEASON: ${{ vars.WEEKS_IN_SEASON || 22 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID_TROPHY_DATA: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID_TROPHY_DATA }}
          CLOUDFLARE_KV_NAMESPACE_ID_MATCHUP_DATA: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID_MATCHUP_DATA }}
          CLOUDFLARE_KV_NAMESPACE_ID_DRAFTED_PLAYER_STATS: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID_DRAFTED_PLAYER_STATS }}
          CLOUDFLARE_KV_KEY_TROPHY_DATA: "trophy-data"
          CLOUDFLARE_KV_KEY_MATCHUP_DATA: "matchup-data"
          CLOUDFLARE_KV_KEY_DRAFTED_PLAYER_STATS: "drafted-player-stats"
          __cf_bm: ${{ secrets.CF_BM }}
          cf_clearance: ${{ secrets.CF_CLEARANCE }}
          FX_RM: ${{ secrets.FX_RM }}
          JSESSIONID: ${{ secrets.JSESSIONID }}
        run: python MainUpdateTrophyStats.py
