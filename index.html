<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GHL Trophy Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-main">
          <div class="brand-wrap">
            <div class="brand-mark">🏒</div>
            <div class="topbar-copy">
              <h2 class="topbar-title">GHL Trophy Tracker</h2>
              <div class="topbar-subtitle-row">
                <p class="topbar-subtitle">LEAGUE HONORS</p>
                <label class="season-picker" for="seasonSelect">
                  <select id="seasonSelect"></select>
                </label>
              </div>
              <div class="topbar-updated">
                <span class="stat-label">Updated</span>
                <span id="lastUpdatedText" class="updated-text">--</span>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="dashboard">
        <div class="dashboard-layout">
          <div class="dashboard-main">
            <section class="top-board-card" aria-live="polite">
              <div class="top-board-tabs" role="tablist" aria-label="Top board views">
                <button id="tabMatchupBoard" class="top-board-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="matchupPane">Matchup Board</button>
                <button id="tabSeasonLeaderboard" class="top-board-tab" type="button" role="tab" aria-selected="false" aria-controls="leaderboardPane">Season Leaderboard</button>
              </div>

              <div id="matchupPane" class="top-board-pane" role="tabpanel" aria-labelledby="tabMatchupBoard">
                <section id="matchupBoard" class="matchup-board"></section>
              </div>

              <div id="leaderboardPane" class="top-board-pane" role="tabpanel" aria-labelledby="tabSeasonLeaderboard" hidden>
                <aside class="leaderboard-panel">
                  <div class="leaderboard-header">
                    <p class="eyebrow">Season leaderboard</p>
                    <p class="leaderboard-note">Expand a team to see the trophies, awards, bounties, and achievements it leads.</p>
                  </div>
                  <div id="leaderboard" class="leaderboard"></div>
                </aside>
              </div>
            </section>

            <section id="trophyGrid" class="trophy-grid" aria-live="polite"></section>
          </div>
        </div>
      </main>
    </div>

    <script src="trophy-data.js"></script>
    <script src="matchup-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
