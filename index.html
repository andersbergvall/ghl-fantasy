<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GHL Trophy Tracker</title>
    <link rel="icon" type="image/png" href="ghllogo.png" />
    <link rel="apple-touch-icon" href="ghllogo.png" />
    <script>
      const workerBase = "https://purple-meadow-3929.anders-bergvall-bd5.workers.dev";
      window.__GHL_TROPHY_DATA_URL__ = `${workerBase}/trophy-data?v=20261007`;
      window.__GHL_MATCHUP_DATA_URL__ = `${workerBase}/matchup-data?v=20261007`;
      window.__GHL_DRAFT_CLASS_DATA_URL__ = `${workerBase}/drafted-player-stats?v=20261008`;
      window.__GHL_FA_PLAYER_STATS_DATA_URL__ = `${workerBase}/fa-player-stats?v=20261015`;
      window.__GHL_TROPHY_DATA_HISTORY_URL__ = `${workerBase}/trophy-data-history?v=20261007`;
      window.__GHL_MATCHUP_DATA_HISTORY_URL__ = `${workerBase}/matchup-data-history?v=20261007`;
      window.__GHL_DRAFT_CLASS_HISTORY_DATA_URL__ = `${workerBase}/drafted-player-stats-history?v=20261008`;
      window.__GHL_OWNER_CONFIG_URL__ = `archived_years/owner_config.csv?v=20261010`;
      window.__GHL_LOGO_CONFIG_URL__ = `logo_config.csv?v=20261015`;
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-main">
          <div class="brand-wrap">
            <div class="brand-mark">
              <img class="brand-logo" src="ghllogo.png" alt="GHL logo" />
            </div>
            <div class="topbar-copy">
              <h2 class="topbar-title">GHL Trophy Tracker</h2>
              <div class="topbar-subtitle-row">
                <p class="topbar-subtitle">League Honors</p>
                <span id="seasonTitle" class="topbar-season">--</span>
              </div>
              <div class="topbar-updated">
                <span class="stat-label">Updated</span>
                <span id="lastUpdatedText" class="updated-text">--</span>
              </div>
            </div>
          </div>
        </div>
      </header>

      <div class="season-filter-bar">
        <label class="season-filter" for="seasonSelect">
          <span class="filter-group-label">Season</span>
          <select id="seasonSelect" class="draft-class-select season-select"></select>
        </label>
      </div>

      <main class="dashboard">
        <div class="dashboard-layout">
          <div class="dashboard-main">
            <section class="top-board-card" aria-live="polite">
              <div class="top-board-tabs" role="tablist" aria-label="Top board views">
                <button id="tabSeasonLeaderboard" class="top-board-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="leaderboardPane"><span class="top-board-tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="2" y="11" width="5" height="9" rx="1"></rect><rect x="9.5" y="6" width="5" height="14" rx="1"></rect><rect x="17" y="9" width="5" height="11" rx="1"></rect></svg></span><span class="top-board-tab-label">Leaders</span></button>
                <button id="tabMatchupBoard" class="top-board-tab" type="button" role="tab" aria-selected="false" aria-controls="matchupPane"><span class="top-board-tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M12 5v14"></path><circle cx="8" cy="12" r="1.5"></circle><circle cx="16" cy="12" r="1.5"></circle></svg></span><span class="top-board-tab-label">Matchups</span></button>
                <button id="tabDraftClass" class="top-board-tab" type="button" role="tab" aria-selected="false" aria-controls="draftClassPane"><span class="top-board-tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M4 20l4.5-1 9.5-9.5-3.5-3.5L5 15.5 4 20z"></path><path d="M13.5 6l3.5 3.5"></path></svg></span><span class="top-board-tab-label">Draft</span></button>
                <button id="tabFaSnipes" class="top-board-tab" type="button" role="tab" aria-selected="false" aria-controls="faSnipesPane"><span class="top-board-tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M2 12h12l2-2h6"></path><path d="M10 12v3"></path><path d="M14 10l2 2-2 2"></path><path d="M6 12l-2-2"></path></svg></span><span class="top-board-tab-label">FA Snipes</span></button>
                <button id="tabBingoBoard" class="top-board-tab" type="button" role="tab" aria-selected="false" aria-controls="bingoBoardPane"><span class="top-board-tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.2"></circle><text x="12" y="12.9" text-anchor="middle" class="top-board-tab-icon-number">8</text></svg></span><span class="top-board-tab-label">Bingo!</span></button>
              </div>

              <div id="matchupPane" class="top-board-pane" role="tabpanel" aria-labelledby="tabMatchupBoard" hidden>
                <section id="matchupBoard" class="matchup-board"></section>
              </div>

              <div id="leaderboardPane" class="top-board-pane" role="tabpanel" aria-labelledby="tabSeasonLeaderboard">
                <aside class="leaderboard-panel">
                  <div class="leaderboard-header">
                    <p class="eyebrow">Season leaderboard</p>
                    <p class="leaderboard-note">Expand a team to see the trophies, awards, bounties, and achievements it leads.</p>
                  </div>
                  <div id="leaderboard" class="leaderboard"></div>
                </aside>
              </div>

              <div id="draftClassPane" class="top-board-pane" role="tabpanel" aria-labelledby="tabDraftClass" hidden></div>

              <div id="faSnipesPane" class="top-board-pane" role="tabpanel" aria-labelledby="tabFaSnipes" hidden></div>

              <div id="bingoBoardPane" class="top-board-pane" role="tabpanel" aria-labelledby="tabBingoBoard" hidden></div>
            </section>

            <section id="trophyGrid" class="trophy-grid" aria-live="polite"></section>
          </div>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
