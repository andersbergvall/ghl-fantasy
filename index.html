<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GHL Trophy Tracker</title>
    <link rel="icon" type="image/png" href="ghllogo.png" />
    <link rel="apple-touch-icon" href="ghllogo.png" />
    <script>
      const workerBase = "https://purple-meadow-3929.anders-bergvall-bd5.workers.dev";
      window.__GHL_TROPHY_DATA_URL__ = `${workerBase}/trophy-data?v=20261007`;
      window.__GHL_MATCHUP_DATA_URL__ = `${workerBase}/matchup-data?v=20261007`;
      window.__GHL_DRAFT_CLASS_DATA_URL__ = `${workerBase}/drafted-player-stats?v=20261008`;
      window.__GHL_FA_PLAYER_STATS_DATA_URL__ = `${workerBase}/fa-player-stats?v=20261015`;
      window.__GHL_TROPHY_DATA_HISTORY_URL__ = `${workerBase}/trophy-data-history?v=20261007`;
      window.__GHL_MATCHUP_DATA_HISTORY_URL__ = `${workerBase}/matchup-data-history?v=20261007`;
      window.__GHL_DRAFT_CLASS_HISTORY_DATA_URL__ = `${workerBase}/drafted-player-stats-history?v=20261008`;
      window.__GHL_OWNER_CONFIG_URL__ = `config/owner_config.csv?v=20261015`;
      window.__GHL_LOGO_CONFIG_URL__ = `config/logo_config.csv?v=20261015`;
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-main">
          <div class="brand-wrap">
            <div class="brand-mark">
              <img class="brand-logo" src="ghllogo.png" alt="GHL logo" />
            </div>
            <div class="topbar-copy">
              <h2 class="topbar-title">GHL Trophy Tracker</h2>
              <div class="topbar-subtitle-row">
                <p class="topbar-subtitle">League Honors</p>
                <label class="season-select-shell" aria-label="Season">
                  <select id="seasonSelect" class="season-select"></select>
                  <span class="season-select-arrow" aria-hidden="true">▼</span>
                </label>
              </div>
              <div class="topbar-updated">
                <span class="stat-label">Updated</span>
                <span id="lastUpdatedText" class="updated-text">--</span>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="dashboard">
        <div class="dashboard-layout">
          <div class="dashboard-main">
            <section class="top-board-card" aria-live="polite">
              <div class="top-board-tabs" role="tablist" aria-label="Top board views">
                <button id="tabSeasonLeaderboard" class="top-board-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="leaderboardPane"><span class="top-board-tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="2" y="11" width="5" height="9" rx="1"></rect><rect x="9.5" y="6" width="5" height="14" rx="1"></rect><rect x="17" y="9" width="5" height="11" rx="1"></rect></svg></span><span class="top-board-tab-label">Leaders</span></button>
                <button id="tabMatchupBoard" class="top-board-tab" type="button" role="tab" aria-selected="false" aria-controls="matchupPane"><span class="top-board-tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M12 5v14"></path><text x="8" y="13.6" text-anchor="middle" class="top-board-tab-icon-number">2</text><text x="16" y="13.6" text-anchor="middle" class="top-board-tab-icon-number">0</text></svg></span><span class="top-board-tab-label">Matchups</span></button>
                <button id="tabDraftClass" class="top-board-tab" type="button" role="tab" aria-selected="false" aria-controls="draftClassPane"><span class="top-board-tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8.2 9h4"></path><path d="M8.2 13h4"></path><path d="M8.2 17h4"></path><path d="M15.6 15.2V9.8"></path><path d="M14 11.3l1.6-1.6 1.6 1.6"></path></svg></span><span class="top-board-tab-label">Draft</span></button>
                <button id="tabFaSnipes" class="top-board-tab" type="button" role="tab" aria-selected="false" aria-controls="faSnipesPane"><span class="top-board-tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 3v3"></path><path d="M12 18v3"></path><path d="M3 12h3"></path><path d="M18 12h3"></path></svg></span><span class="top-board-tab-label">FA Snipes</span></button>
                <button id="tabBingoBoard" class="top-board-tab" type="button" role="tab" aria-selected="false" aria-controls="bingoBoardPane"><span class="top-board-tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="7.2" cy="13.9" r="4.9" class="top-board-tab-icon-ball"></circle><circle cx="12.1" cy="8.5" r="4.9" class="top-board-tab-icon-ball"></circle><circle cx="16.9" cy="13.3" r="4.9" class="top-board-tab-icon-ball"></circle><circle cx="7.2" cy="13.9" r="2.2" class="top-board-tab-icon-ball-inner"></circle><circle cx="12.1" cy="8.5" r="2.2" class="top-board-tab-icon-ball-inner"></circle><circle cx="16.9" cy="13.3" r="2.2" class="top-board-tab-icon-ball-inner"></circle><text x="7.2" y="15" text-anchor="middle" class="top-board-tab-icon-ball-letter">7</text><text x="12.1" y="9.6" text-anchor="middle" class="top-board-tab-icon-ball-letter">2</text><text x="16.9" y="14.4" text-anchor="middle" class="top-board-tab-icon-ball-letter">9</text></svg></span><span class="top-board-tab-label">Bingo!</span></button>
              </div>

              <div id="matchupPane" class="top-board-pane" role="tabpanel" aria-labelledby="tabMatchupBoard" hidden>
                <section id="matchupBoard" class="matchup-board"></section>
              </div>

              <div id="leaderboardPane" class="top-board-pane" role="tabpanel" aria-labelledby="tabSeasonLeaderboard">
                <aside class="leaderboard-panel">
                  <div class="leaderboard-header">
                    <p class="eyebrow">Season leaderboard</p>
                  </div>
                  <div id="leaderboard" class="leaderboard"></div>
                </aside>
              </div>

              <div id="draftClassPane" class="top-board-pane" role="tabpanel" aria-labelledby="tabDraftClass" hidden></div>

              <div id="faSnipesPane" class="top-board-pane" role="tabpanel" aria-labelledby="tabFaSnipes" hidden></div>

              <div id="bingoBoardPane" class="top-board-pane" role="tabpanel" aria-labelledby="tabBingoBoard" hidden></div>
            </section>

            <section id="trophyGrid" class="trophy-grid" aria-live="polite"></section>
          </div>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
